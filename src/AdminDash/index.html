  <!-- Dashboard Stats -->
<script>
async function fetchDashboardStats() {
  try {
    const stats = await apiGet('/api/dashboard-stats');
    document.getElementById('stat-total-users').textContent = stats.totalUsers;
    document.getElementById('stat-available-slots').textContent = stats.availableSlots;
    document.getElementById('stat-occupied-slots').textContent = stats.occupiedSlots;
    document.getElementById('stat-admins').textContent = stats.admins;
  } catch (err) {
    console.error('Failed to load dashboard stats:', err);
  }
}
window.addEventListener('DOMContentLoaded', fetchDashboardStats);

async function loadHeaderUser() {
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    const data = await res.json();

    console.log('AUTH /api/me:', data);

    if (!data.loggedIn) {
      window.location.href = './authentication-login.html';
      return;
    }

    document.getElementById('header-username').textContent = data.username;
    document.getElementById('header-role').textContent = data.role;
    document.getElementById('header-session-id').textContent = data.sessionID;

    // avatar initial
    document.querySelector('.rounded-circle').textContent =
      data.username?.charAt(0).toUpperCase();

  } catch (err) {
    console.error('Failed to load user header:', err);
  }
}

document.getElementById('logout-btn')?.addEventListener('click', async () => {
  await fetch('/logout', { method: 'POST', credentials: 'include' });
  window.location.href = './authentication-login.html';
});

window.addEventListener('DOMContentLoaded', () => {
  loadHeaderUser();
  fetchDashboardStats();
});
</script>
